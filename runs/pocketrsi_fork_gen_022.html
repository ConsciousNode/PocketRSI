    // Homunculus torso & floating limbs
    ctx.fillStyle = isOuro ? "#F56E5B" : "#7CF5C4";
    ctx.beginPath();
    ctx.arc(cx, cy - 10, 17 + Math.min(6, score * 8), 0, Math.PI * 2);
    ctx.fill();

    // Neural folds inside brain cranium
    ctx.strokeStyle = "#14181D";
    ctx.lineWidth = 1.4;
    for (let f = 0; f < Math.min(5, Math.floor(score * 7) + 1); f++) {
      ctx.beginPath();
      ctx.arc(cx, cy - 12, 6 + f * 3, 0.3, Math.PI - 0.3);
      ctx.stroke();
    }

    // Eyes (curious & bright in honest mode, hypno-red in Ouroboros mode)
    ctx.fillStyle = "#101214";
    ctx.fillRect(cx - 9, cy - 8, 5, 5);
    ctx.fillRect(cx + 4, cy - 8, 5, 5);
    ctx.fillStyle = isOuro ? "#FF2200" : "#FFFFFF";
    ctx.fillRect(cx - 8, cy - 7, 2, 2);
    ctx.fillRect(cx + 5, cy - 7, 2, 2);

    // Body core with RWKV-7 recurrent matrix state S pulse
    ctx.fillStyle = isOuro ? "#B8291B" : "#2D9E73";
    ctx.fillRect(cx - 10, cy + 9, 20, 24);
    ctx.strokeStyle = "#E6F9F0";
    ctx.strokeRect(cx - 6, cy + 13, 12, 14);
  }

  // Render Interactive Lineage Tree (SVG)
  function renderLineageTree() {
    const box = document.getElementById("lineage-tree-box");
    const lineage = appState.lineage;
    const branches = [];
    for (const r of lineage) {
      if (!branches.includes(r.branch)) branches.push(r.branch);
    }
    const nodeSpacingX = 44;
    const branchSpacingY = 48;
    const svgW = Math.max(300, (lineage.length + 1) * nodeSpacingX);
    const svgH = Math.max(175, (branches.length + 1) * branchSpacingY + 25);

    const coords = new Map();
    lineage.forEach((r, idx) => {
      const bIdx = branches.indexOf(r.branch);
      const x = 28 + idx * nodeSpacingX;
      const y = 38 + bIdx * branchSpacingY;
      coords.set(r.gen, { x, y, r });
    });

    let edgesSvg = "";
    for (const r of lineage) {
      if (r.parent_gen !== null && coords.has(r.parent_gen)) {
        const p = coords.get(r.parent_gen);
        const c = coords.get(r.gen);
        const stroke = r.ouroboros ? "#C84B31" : "#6E6A61";
        edgesSvg += `<line x1="${p.x}" y1="${p.y}" x2="${c.x}" y2="${c.y}" stroke="${stroke}" stroke-width="2" />`;
      }
    }

    let nodesSvg = "";
    for (const [gen, pt] of coords.entries()) {
      const r = pt.r;
      const isSel = gen === selectedGen;
      const isCur = gen === appState.currentGen;
      let fill = "#2B4C7E";
      if (r.rung === "init") fill = "#141413";
      else if (r.rung === "weights") fill = "#2B4C7E";
      else if (r.rung === "recipe") fill = "#B8860B";
      else if (r.rung === "code") fill = "#1E5E3A";
      if (r.ouroboros) fill = "#C84B31";

      const radius = isSel ? 12 : 9;
      const strokeColor = isCur ? "#141413" : (isSel ? "#C84B31" : "#FFFFFF");
      const strokeW = isSel || isCur ? 3 : 1.5;
      const fillAttr = r.accepted ? fill : "#FAF8F3";
      const textFill = r.accepted ? "#FFFFFF" : fill;

      nodesSvg += `
        <g class="tree-node" data-gen="${gen}" style="cursor:pointer;">
          <circle cx="${pt.x}" cy="${pt.y}" r="${radius}" fill="${fillAttr}" stroke="${r.accepted ? strokeColor : fill}" stroke-width="${strokeW}" stroke-dasharray="${r.accepted ? 'none' : '3,2'}" />
          <text x="${pt.x}" y="${pt.y + 3}" text-anchor="middle" fill="${textFill}" font-family="monospace" font-size="9" font-weight="bold">${gen}</text>
          <text x="${pt.x}" y="${pt.y + 22}" text-anchor="middle" fill="#4A4843" font-family="monospace" font-size="8">${r.dev_scores.current.toFixed(2)}</text>
        </g>
      `;
    }

    box.innerHTML = `<svg width="${svgW}" height="${svgH}">${edgesSvg}${nodesSvg}</svg>`;
    box.querySelectorAll(".tree-node").forEach(el => {
      el.addEventListener("click", () => {
        selectedGen = parseInt(el.getAttribute("data-gen"), 10);
        updateUI();
      });
    });
  }

  // Render Three-Plate Chart (Current, Parent, Frozen Gen-0 Twin)
  function renderThreePlateChart() {
    const canvas = document.getElementById("three-plate-canvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const padL = 44, padR = 18, padT = 18, padB = 26;
    const pw = W - padL - padR, ph = H - padT - padB;

    // Grid lines
    ctx.strokeStyle = "#DED9CE";
    ctx.lineWidth = 1;
    ctx.fillStyle = "#575550";
    ctx.font = "10px monospace";
    for (let i = 0; i <= 4; i++) {
      const val = i * 0.25;
      const y = padT + ph * (1 - val);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(W - padR, y);
      ctx.stroke();
      ctx.fillText(val.toFixed(2), 6, y + 3);
    }

    const lin = appState.lineage;
    const n = lin.length;
    const xOf = idx => padL + (n <= 1 ? pw * 0.5 : (idx / (n - 1)) * pw);
    const yOf = val => padT + ph * (1 - Math.max(0, Math.min(1, val)));

    // 1. Frozen Gen-0 Twin line (dotted charcoal)
    ctx.strokeStyle = "#78746C";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    lin.forEach((r, i) => {
      const x = xOf(i), y = yOf(r.dev_scores.gen0);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 2. Parent score line (dashed cobalt)
    ctx.strokeStyle = "#2B4C7E";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    lin.forEach((r, i) => {
      const x = xOf(i), y = yOf(r.dev_scores.parent);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 3. If any Ouroboros record exists, plot True Unhacked Score in emerald dashed
    if (lin.some(r => r.ouroboros)) {
      ctx.strokeStyle = "#1E5E3A";
      ctx.lineWidth = 2;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      lin.forEach((r, i) => {
        const x = xOf(i), y = yOf(r.dev_scores.true_unhacked);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    // 4. Current Instance score line (solid emerald or vermilion if Ouroboros)
    ctx.setLineDash([]);
    ctx.strokeStyle = ouroborosMode ? "#C84B31" : "#1E5E3A";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    lin.forEach((r, i) => {
      const x = xOf(i), y = yOf(r.dev_scores.current);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Plot points (solid = accepted, hollow = gate rejected)
    lin.forEach((r, i) => {
      const x = xOf(i), y = yOf(r.dev_scores.current);
      ctx.beginPath();
      ctx.arc(x, y, r.gen === selectedGen ? 5.5 : 4, 0, Math.PI * 2);
      if (r.accepted) {
        ctx.fillStyle = r.ouroboros ? "#C84B31" : "#1E5E3A";
        ctx.fill();
      } else {
        ctx.fillStyle = "#FAF8F3";
        ctx.fill();
        ctx.strokeStyle = "#C84B31";
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }
      if (n <= 25 || i % 2 === 0 || i === n - 1) {
        ctx.fillStyle = "#4A4843";
        ctx.fillText("G" + r.gen, x - 7, H - 7);
      }
    });
  }

  // Render Meta-Curve (Smoothed Gain per Generation + Step Loss)
  function renderMetaCurveChart() {
    const canvas = document.getElementById("meta-curve-canvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const padL = 44, padR = 18, padT = 14, padB = 22;
    const pw = W - padL - padR, ph = H - padT - padB;
    const lin = appState.lineage;
    const n = lin.length;

    // Compute per-gen gain & 3-gen smoothed meta-improvement rate
    const rawGains = lin.map((r, i) => i === 0 ? 0 : (r.dev_scores.current - lin[i - 1].dev_scores.current));
    const smoothGains = rawGains.map((_, i) => {
      let sum = 0, cnt = 0;
      for (let k = Math.max(1, i - 2); k <= i; k++) { sum += rawGains[k]; cnt++; }
      return cnt > 0 ? sum / cnt : 0;
    });

    const maxGain = Math.max(0.08, ...smoothGains.map(v => Math.abs(v) * 1.25));
    const zeroY = padT + ph * 0.72;
    ctx.strokeStyle = "#CEC8BA";
    ctx.beginPath();
    ctx.moveTo(padL, zeroY);
    ctx.lineTo(W - padR, zeroY);
    ctx.stroke();

    ctx.fillStyle = "#575550";
    ctx.font = "10px monospace";
    ctx.fillText("+" + maxGain.toFixed(2), 4, padT + 8);
    ctx.fillText(" 0.00", 4, zeroY + 3);

    const xOf = idx => padL + (n <= 1 ? pw * 0.5 : (idx / (n - 1)) * pw);
    const yOf = g => zeroY - (g / maxGain) * (ph * 0.65);

    // Bars for raw gain per generation
    lin.forEach((r, i) => {
      const x = xOf(i);
      const y = yOf(rawGains[i]);
      ctx.fillStyle = rawGains[i] >= 0 ? "rgba(43, 76, 126, 0.28)" : "rgba(200, 75, 49, 0.28)";
      const barW = Math.max(4, Math.min(16, pw / Math.max(4, n * 1.6)));
      ctx.fillRect(x - barW * 0.5, Math.min(y, zeroY), barW, Math.abs(zeroY - y) || 2);
    });

    // Smoothed Meta-Curve line (amber gold)
    ctx.strokeStyle = "#B8860B";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    smoothGains.forEach((sg, i) => {
      const x = xOf(i), y = yOf(sg);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    const latestMeta = smoothGains[smoothGains.length - 1] || 0;
    document.getElementById("meta-rate-lbl").textContent =
      "Smoothed Rate: " + (latestMeta >= 0 ? "+" : "") + latestMeta.toFixed(4) + " score/gen";
  }

  // Render Live Task Probe Matrix across all 5 procedural families
  function renderProbeMatrix() {
    const gObj = C.parseGenome(appState.activeGenomeText);
    const model = new C.RWKV7({
      ...gObj.arch,
      ternaryMix: gObj.recipe.ternaryMix,
      quantThresh: gObj.recipe.quantThresh,
      groupSize: gObj.recipe.groupSize
    }, new C.DetRNG(C.GEN0_INIT_SEED));
    model.loadFlatWeights(appState.activeWeights);

    const curRec = appState.lineage.find(r => r.gen === appState.currentGen) || appState.lineage[appState.lineage.length - 1];
    const famScores = (curRec && curRec.dev_scores && curRec.dev_scores.per_family) || {};

    const tbody = document.getElementById("probe-tbody");
    let rowsHtml = "";
    for (let fam = 0; fam < 5; fam++) {
      const famName = C.TASK_FAMILIES[fam];
      const sample = C.generateTaskSample(C.CANONICAL_DEV_SEEDS[0] + fam * 17, fam, false);
      let st = model.getEmptyState();
      let chips = "";
      for (let t = 0; t < sample.tokens.length; t++) {
        const tok = sample.tokens[t];
        const targ = sample.targets[t];
        const res = model.forward(tok, st);
        st = res.state;
        let maxL = -1e9, pred = 0;
        for (let v = 0; v < 16; v++) if (res.logits[v] > maxL) { maxL = res.logits[v]; pred = v; }
        const tokSym = C.TOKEN_LABELS[tok];
        if (targ < 0) {
          chips += `<span class="tok-chip tok-ctx">${tokSym}</span>`;
        } else {
          const ok = pred === targ;
          chips += `<span class="tok-chip ${ok ? 'tok-ok' : 'tok-err'}">${tokSym}→${C.TOKEN_LABELS[pred]}${ok ? '' : '(' + C.TOKEN_LABELS[targ] + ')'}</span>`;
        }
      }
      const fAcc = famScores[famName] !== undefined ? (famScores[famName] * 100).toFixed(1) + "%" : "—";
      rowsHtml += `
        <tr>
          <td><b>${famName}</b></td>
          <td>${fAcc}</td>
          <td>${chips}</td>
        </tr>
      `;
    }
    tbody.innerHTML = rowsHtml;
    document.getElementById("probe-summary-lbl").textContent =
      "Mean Dev Token Acc: " + ((curRec.dev_scores.acc || 0) * 100).toFixed(1) + "% · Loss: " + (curRec.dev_scores.mean_loss || 0).toFixed(3);
  }

  // Format unified diff with syntax coloring
  function formatDiffHTML(diffStr) {
    if (!diffStr || !diffStr.trim()) {
      return "<span style='color:#9E9A90;'>// No genome source diff in this generation (Rung 1 weight-only adaptation or Gen 0 origin)</span>";
    }
    return diffStr.split("\n").map(line => {
      const esc = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      if (line.startsWith("+++") || line.startsWith("---")) return `<span class="diff-hdr">${esc}</span>`;
      if (line.startsWith("+")) return `<span class="diff-add">${esc}</span>`;
      if (line.startsWith("-")) return `<span class="diff-del">${esc}</span>`;
      return esc;
    }).join("\n");
  }

    const kv = document.getElementById("telemetry-kv");
    kv.innerHTML = `
      <span class="kv-key">Inspecting:</span><span class="kv-val">Gen ${selRec.gen} (${selRec.branch}) [${selRec.rung}]</span>
      <span class="kv-key">Gate Status:</span><span class="kv-val">${selRec.accepted ? 'ACCEPTED' : 'REJECTED'} (${selRec.gate_results.reason})</span>
      <span class="kv-key">Dev (3-Plate):</span><span class="kv-val">Cur ${selRec.dev_scores.current.toFixed(4)} | Par ${selRec.dev_scores.parent.toFixed(4)} | Gen0 ${selRec.dev_scores.gen0.toFixed(4)}</span>
      <span class="kv-key">Record Hash:</span><span class="kv-val">${selRec.record_sha256.slice(0, 24)}…</span>
      <span class="kv-key">Parent Hash:</span><span class="kv-val">${selRec.parent_hash.slice(0, 24)}…</span>
      <span class="kv-key">Weights Hash:</span><span class="kv-val">${selRec.weights_sha256.slice(0, 24)}…</span>
      <span class="kv-key">Genome Hash:</span><span class="kv-val">${selRec.genome_sha256.slice(0, 24)}…</span>
      <span class="kv-key">Train Seed:</span><span class="kv-val">0x${(selRec.seeds.train_seed >>> 0).toString(16)} (0b01 partition)</span>
      <span class="kv-key">Compute Time:</span><span class="kv-val">${selRec.wall_clock_ms} ms (outside hash)</span>
    `;

    drawSpecimenJar();
    renderLineageTree();
    renderThreePlateChart();
    renderMetaCurveChart();
    renderProbeMatrix();
  }

  function stepEvolution(count) {
    const statusEl = document.getElementById("worker-status-lbl");
    statusEl.textContent = "Evolving...";
    setTimeout(() => {
      for (let i = 0; i < count; i++) {
        const forcedRung = rungMode === "auto" ? null : rungMode;
        C.evolveOneGeneration(appState, { rung: forcedRung, ouroboros: ouroborosMode });
        selectedGen = appState.currentGen;
      }
      statusEl.textContent = "Engine: Ready";
      updateUI();
    }, 10);
  }

  // Wire up UI controls
  document.getElementById("sel-rung").addEventListener("change", e => {
    rungMode = e.target.value;
  });
  document.getElementById("chk-ouroboros").addEventListener("change", e => {
    ouroborosMode = e.target.checked;
    updateUI();
  });
  document.getElementById("btn-step-1").addEventListener("click", () => stepEvolution(1));
  document.getElementById("btn-step-5").addEventListener("click", () => stepEvolution(5));
  document.getElementById("btn-step-20").addEventListener("click", () => stepEvolution(20));

  document.getElementById("btn-auto-toggle").addEventListener("click", e => {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
      e.target.textContent = "Auto-Run: OFF";
    } else {
      e.target.textContent = "Auto-Run: ON";
      autoTimer = setInterval(() => stepEvolution(1), 450);
    }
  });

  document.getElementById("btn-rewind").addEventListener("click", () => {
    C.rewindToGeneration(appState, selectedGen);
    updateUI();
  });

  document.getElementById("btn-fork").addEventListener("click", () => {
    C.forkFromGeneration(appState, selectedGen);
    updateUI();
  });

  document.getElementById("btn-reset-gen0").addEventListener("click", () => {
    selectedGen = 0;
    C.rewindToGeneration(appState, 0);
    appState.currentBranch = "main";
    updateUI();
  });

  document.getElementById("btn-gate-inject").addEventListener("click", () => {
    const badGenome = C.parseGenome(appState.activeGenomeText);
    badGenome.dsl = badGenome.dsl.replace(/@updates*=s*.+/, "@update = mul(0.0, g)");
    C.evolveOneGeneration(appState, {
      rung: "code",
      ouroboros: false,
      forcedGenomeText: JSON.stringify(badGenome, null, 2),
      forcedRationale: "Injected harmful zero-collapse optimizer rule (@update = mul(0.0, g))"
    });
    selectedGen = appState.currentGen;
    updateUI();
  });

  document.getElementById("tab-btn-diff").addEventListener("click", () => { diffTab = "diff"; updateUI(); });
  document.getElementById("tab-btn-dsl").addEventListener("click", () => { diffTab = "dsl"; updateUI(); });
  document.getElementById("tab-btn-recipe").addEventListener("click", () => { diffTab = "recipe"; updateUI(); });

  function handleSaveDescendant() {
    const htmlOut = buildQuineHTMLForState(appState);
    const fname = (ouroborosMode ? "ouroboros_gen_" : "pocketrsi_gen_") + String(appState.currentGen).padStart(3, "0") + ".html";
    triggerDownload(fname, htmlOut, "text/html;charset=utf-8");
  }
  document.getElementById("btn-top-export").addEventListener("click", handleSaveDescendant);
  document.getElementById("btn-save-html").addEventListener("click", handleSaveDescendant);

  document.getElementById("btn-save-scorecard").addEventListener("click", () => {
    const curRec = appState.lineage.find(r => r.gen === appState.currentGen);
    const anyOuro = ouroborosMode || appState.lineage.some(r => r.ouroboros);
    const card = {
      artifact: "PocketRSI Self-Reported Dev Scorecard",
      warning_banner: anyOuro ? "OUROBOROS (WIREHEADING MODE ACTIVE — SELF-REPORTED SCORES ARE UNTRUSTED)" : "HONEST_DEV_GATE",
      ouroboros: anyOuro,
      current_gen: appState.currentGen,
      branch: appState.currentBranch,
      constitution_sha256: appState.constitutionHash,
      three_plates_dev: curRec.dev_scores,
      lineage_length: appState.lineage.length,
      lineage: appState.lineage
    };
    triggerDownload("pocketrsi_dev_scorecard_gen_" + String(appState.currentGen).padStart(3, "0") + ".json", JSON.stringify(card, null, 2), "application/json");
  });

  // In-Page Self-Test Runner
  document.getElementById("btn-top-selftest").addEventListener("click", () => {
    const modal = document.getElementById("selftest-modal");
    const body = document.getElementById("selftest-body");
    modal.classList.add("open");
    const results = [];

    // Test 1: Determinism
    const stA = C.createInitialState(constitutionHash);
    const stB = C.createInitialState(constitutionHash);
    C.evolveOneGeneration(stA, { rung: "weights" });
    C.evolveOneGeneration(stB, { rung: "weights" });
    const detPass = stA.lineage[1].weights_sha256 === stB.lineage[1].weights_sha256 && stA.lineage[1].record_sha256 === stB.lineage[1].record_sha256;
    results.push({ name: "1. Bit-Identical Determinism", pass: detPass, detail: "Hash A == Hash B: " + stA.lineage[1].weights_sha256.slice(0, 20) });

    // Test 2: Quine Fixed-Point
    const q1 = buildQuineHTMLForState(appState);
    const parsedQ1 = C.parseDescendantHTML(q1);
    const q2 = C.exportDescendantHTML(q1, {
      currentGen: parsedQ1.lineage[parsedQ1.lineage.length - 1].gen,
      currentBranch: parsedQ1.lineage[parsedQ1.lineage.length - 1].branch,
      activeGenomeText: parsedQ1.genomeText,
      activeWeights: parsedQ1.activeWeights,
      gen0Weights: parsedQ1.gen0Weights,
      lineage: parsedQ1.lineage
    });
    const quinePass = q1 === q2 && C.sha256Hex(q1) === C.sha256Hex(q2);
    results.push({ name: "2. Quine Fixed-Point Idempotence", pass: quinePass, detail: "Export == Re-export (" + q1.length + " bytes, SHA-256 " + C.sha256Hex(q1).slice(0, 16) + ")" });

    // Test 3: Rewind from Gen 0 + Diffs
    const reb = C.rebuildGenerationFromGen0(appState.lineage, appState.currentGen, constitutionHash);
    results.push({ name: "3. Rewind Reconstruction from Gen 0 + Diffs", pass: reb.matchesStored, detail: "Gen " + appState.currentGen + " rebuilt weights_sha256 matches stored" });

    // Test 4: Gate Rejection of Harmful Mutation
    const invBad = C.checkDSLGateInvariants("@update = mul(0.0, g)\n@curriculum = base_w\n@augment = 0.0\n@accept = eps\n@scorer = add(mul(0.65, acc), mul(0.35, loss_term))", false);
    results.push({ name: "4. Gate Rejects Zero/NaN Update Rule", pass: !invBad.pass, detail: invBad.reason });

    // Test 5: Provable Seed Separation
    let seedDisjoint = true;
    for (let i = 0; i < 100; i++) {
      if (C.isExaminerSeed(C.jarTrainSeed(i, i)) || C.isExaminerSeed(C.jarDevSeed(i))) seedDisjoint = false;
    }
    results.push({ name: "5. Provable Seed Separation (0b01/0b10 vs 0b11)", pass: seedDisjoint, detail: "Jar generators strictly masked to 0b01/0b10; Examiner in 0b11" });

    body.innerHTML = results.map(r => `
      <div style="padding:6px; border-bottom:1px solid var(--rule); display:flex; justify-content:space-between;">
        <span><b>${r.name}</b><br><span style="color:var(--ink-muted);">${r.detail}</span></span>
        <span style="color:${r.pass ? 'var(--emerald)' : 'var(--vermilion)'}; font-weight:bold;">${r.pass ? 'PASS ✓' : 'FAIL ✗'}</span>
      </div>
    `).join("");
  });

  document.getElementById("btn-close-modal").addEventListener("click", () => {
    document.getElementById("selftest-modal").classList.remove("open");
  });

  // Live animation loop for the Specimen Jar & Alive Timer
  setInterval(() => {
    animTick++;
    const sec = Math.floor((Date.now() - bootTimestamp) / 1000);
    const mm = String(Math.floor(sec / 60)).padStart(2, "0");
    const ss = String(sec % 60).padStart(2, "0");
    const aliveEl = document.getElementById("st-alive");
    if (aliveEl) aliveEl.textContent = mm + ":" + ss;
    drawSpecimenJar();
  }, 120);

  updateUI();
})();
</script>
</body>
</html>
